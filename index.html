
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校园活动站</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Microsoft YaHei", Arial, sans-serif;
      color: #243047;
      background-color: #f5f7fb;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    header {
      padding: 22px 9%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #ffffff;
      border-bottom: 1px solid #edf0f5;
    }

    .logo {
      color: #243b70;
      font-size: 20px;
      font-weight: 700;
    }

    nav {
      display: flex;
      gap: 36px;
    }

    nav a {
      color: #69758b;
      font-size: 15px;
    }

    nav a:hover {
      color: #4263eb;
    }

    .hero {
      margin: 36px 9% 60px;
      padding: 55px 65px;
      color: #ffffff;
      background: linear-gradient(120deg, #304fbd, #5479ed);
      border-radius: 20px;
    }

    .hero-label {
      color: #d4ddff;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 3px;
    }

    .hero h1 {
      margin: 16px 0;
      font-size: 36px;
    }

    .hero p {
      max-width: 560px;
      color: #e1e8ff;
      font-size: 15px;
      line-height: 1.8;
    }

    .primary-button {
      display: inline-block;
      margin-top: 16px;
      padding: 11px 25px;
      color: #3657c9;
      background-color: #ffffff;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
    }

    .events-section {
      margin: 0 9% 70px;
    }

    .section-heading {
      margin-bottom: 28px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
    }

    .section-label {
      color: #4263eb;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 3px;
    }

    .section-heading h2 {
      margin: 8px 0;
      font-size: 28px;
    }

    .section-heading p {
      margin: 0;
      color: #8993a6;
      font-size: 14px;
    }

    .event-count {
      padding: 7px 14px;
      color: #4263eb;
      background-color: #e9eeff;
      border-radius: 20px;
      font-size: 13px;
    }

    /* 搜索和分类区域 */
    .event-tools {
      margin-bottom: 26px;
    }

    .search-input {
      width: 420px;
      height: 44px;
      padding: 0 16px;
      color: #243047;
      background-color: #ffffff;
      border: 1px solid #e1e6f0;
      border-radius: 8px;
      outline: none;
    }

    .search-input:focus {
      border-color: #4263eb;
    }

    .category-filters {
      margin-top: 18px;
      display: flex;
      gap: 10px;
    }

    .category-filters button {
      padding: 8px 17px;
      color: #69758b;
      background-color: #ffffff;
      border: 1px solid #e1e6f0;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
    }

    .category-filters button:hover {
      color: #4263eb;
      border-color: #4263eb;
    }

    .category-filters button.active {
      color: #ffffff;
      background-color: #4263eb;
      border-color: #4263eb;
    }

    /* 活动卡片 */
    .event-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 22px;
    }

    .event-card {
      padding: 26px;
      background-color: #ffffff;
      border: 1px solid #edf0f5;
      border-radius: 14px;
      box-shadow: 0 5px 20px rgba(30, 50, 90, 0.04);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .event-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 28px rgba(30, 50, 90, 0.1);
    }

    .event-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .event-category {
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
    }

    .category-lecture {
      color: #4263eb;
      background-color: #e9eeff;
    }

    .category-contest {
      color: #d97706;
      background-color: #fff3df;
    }

    .category-club {
      color: #0d9488;
      background-color: #dcf8f2;
    }

    .category-entertainment {
      color: #a855f7;
      background-color: #f4e8ff;
    }

    .event-number {
      color: #d9dfeb;
      font-size: 24px;
      font-weight: 700;
    }

    .event-card h3 {
      margin: 18px 0 10px;
      color: #263653;
      font-size: 20px;
    }

    .event-description {
      min-height: 48px;
      color: #7d879a;
      font-size: 14px;
      line-height: 1.7;
    }

    .event-meta {
      margin: 20px 0;
      padding-top: 14px;
      border-top: 1px solid #f0f2f6;
    }

    .event-meta p {
      margin: 6px 0;
      color: #69758b;
      font-size: 13px;
    }

    /* 没有搜索结果 */
    .empty-message {
      grid-column: 1 / -1;
      padding: 55px 20px;
      color: #8993a6;
      text-align: center;
      background-color: #ffffff;
      border: 1px dashed #dce2ed;
      border-radius: 14px;
    }

    .empty-message h3 {
      margin: 0 0 8px;
      color: #53617a;
      font-size: 18px;
    }

    .empty-message p {
      margin: 0;
      font-size: 14px;
    }

    .about-section {
      margin: 0 9% 70px;
      padding: 45px 50px;
      text-align: center;
      background-color: #eaf0ff;
      border-radius: 16px;
    }

    .about-section h2 {
      margin: 14px auto;
      color: #283f7e;
      font-size: 25px;
    }

    .about-section p {
      color: #7482a5;
      font-size: 14px;
    }

    footer {
      padding: 28px 9%;
      color: #aab3c3;
      background-color: #202d49;
      text-align: center;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <!-- 网站顶部 -->
  <header>
    <a class="logo" href="#">校园活动站</a>

    <nav>
      <a href="#home">首页</a>
      <a href="#events">活动列表</a>
      <a href="#about">关于我们</a>
    </nav>
  </header>

  <main id="home">

    <!-- 页面介绍 -->
    <section class="hero">
      <span class="hero-label">CAMPUS EVENTS</span>

      <h1>发现身边值得参加的校园活动</h1>

      <p>
        从学术讲座到社团活动，从创新竞赛到校园演出，
        在这里找到你感兴趣的下一站。
      </p>

      <a class="primary-button" href="#events">
        看看近期活动
      </a>
    </section>

    <!-- 活动列表 -->
    <section class="events-section" id="events">

      <div class="section-heading">
        <div>
          <span class="section-label">WHAT'S ON</span>
          <h2>近期活动</h2>
          <p>挑选一场感兴趣的活动，开启新的校园体验。</p>
        </div>

        <span class="event-count" id="eventCount">
          找到 0 场活动
        </span>
      </div>

      <!-- 搜索框和分类按钮 -->
      <div class="event-tools">

        <input
          class="search-input"
          type="text"
          id="searchInput"
          placeholder="搜索活动名称或关键词..."
        >

        <div class="category-filters">
          <button class="active" type="button" data-category="all">
            全部活动
          </button>

          <button type="button" data-category="学术讲座">
            学术讲座
          </button>

          <button type="button" data-category="创新竞赛">
            创新竞赛
          </button>

          <button type="button" data-category="社团活动">
            社团活动
          </button>

          <button type="button" data-category="校园文娱">
            校园文娱
          </button>
        </div>

      </div>

      <!-- 活动卡片由 JavaScript 生成 -->
      <div class="event-list" id="eventList"></div>

    </section>

    <!-- 关于我们 -->
    <section class="about-section" id="about">
      <span class="section-label">ABOUT US</span>

      <h2>让每一次校园活动，都成为值得记住的经历。</h2>

      <p>
        校园活动站汇集校园近期活动信息，
        帮助同学们发现兴趣、参与校园生活。
      </p>
    </section>

  </main>

  <!-- 网站底部 -->
  <footer>
    <p>校园活动站 · 发现校园精彩</p>
    <p>活动信息仅用于课程项目演示。</p>
  </footer>

  <script>
    // 1. 校园活动数据
    const events = [
      {
        title: "人工智能与未来生活",
        category: "学术讲座",
        categoryClass: "category-lecture",
        description: "了解人工智能的发展趋势，以及它将如何影响我们的学习与生活。",
        time: "2026年11月12日 14:00",
        location: "图书馆报告厅"
      },
      {
        title: "校园创意编程挑战赛",
        category: "创新竞赛",
        categoryClass: "category-contest",
        description: "和队友一起动手，把一个有趣的想法变成可以运行的小作品。",
        time: "2026年11月16日 09:00",
        location: "信息楼 301 室"
      },
      {
        title: "摄影社秋日外拍",
        category: "社团活动",
        categoryClass: "category-club",
        description: "带上相机或手机，和摄影社成员一起记录校园里的秋日风景。",
        time: "2026年11月18日 16:00",
        location: "校园东门集合"
      },
      {
        title: "校园草坪音乐会",
        category: "校园文娱",
        categoryClass: "category-entertainment",
        description: "在轻松的夜晚听听音乐，认识新朋友，感受校园的活力。",
        time: "2026年11月21日 19:00",
        location: "中心草坪"
      }
    ];

    // 2. 获取页面元素
    const eventList = document.querySelector("#eventList");
    const eventCount = document.querySelector("#eventCount");
    const searchInput = document.querySelector("#searchInput");

    const categoryButtons = document.querySelectorAll(
      ".category-filters button"
    );

    // 3. 保存当前选择的分类
    let currentCategory = "all";

    // 4. 根据活动数据生成卡片
    function renderEvents(eventData) {
      let html = "";

      if (eventData.length === 0) {
        html = `
          <div class="empty-message">
            <h3>没有找到相关活动</h3>
            <p>试试其他关键词或选择不同的活动分类吧。</p>
          </div>
        `;
      } else {
        eventData.forEach(function (event) {
          const index = events.indexOf(event);

          html += `
            <article class="event-card">
              <div class="event-card-top">
                <span class="event-category ${event.categoryClass}">
                  ${event.category}
                </span>

                <span class="event-number">
                  ${String(index + 1).padStart(2, "0")}
                </span>
              </div>

              <h3>${event.title}</h3>

              <p class="event-description">
                ${event.description}
              </p>

              <div class="event-meta">
                <p>📅 ${event.time}</p>
                <p>📍 ${event.location}</p>
              </div>
            </article>
          `;
        });
      }

      eventList.innerHTML = html;
      eventCount.textContent = `找到 ${eventData.length} 场活动`;
    }

    // 5. 根据关键词和分类筛选活动
    function filterEvents() {
      const keyword = searchInput.value.trim().toLowerCase();

      const filteredEvents = events.filter(function (event) {
        const matchKeyword =
          event.title.toLowerCase().includes(keyword) ||
          event.description.toLowerCase().includes(keyword) ||
          event.category.toLowerCase().includes(keyword);

        const matchCategory =
          currentCategory === "all" ||
          event.category === currentCategory;

        return matchKeyword && matchCategory;
      });

      renderEvents(filteredEvents);
    }

    // 6. 监听搜索框输入
    searchInput.addEventListener("input", function () {
      filterEvents();
    });

    // 7. 监听分类按钮点击
    categoryButtons.forEach(function (button) {
      button.addEventListener("click", function () {
        currentCategory = button.dataset.category;

        categoryButtons.forEach(function (item) {
          item.classList.remove("active");
        });

        button.classList.add("active");

        filterEvents();
      });
    });

    // 8. 页面加载时显示全部活动
    filterEvents();
  </script>

</body>
</html>
