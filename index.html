
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="发现校园里的讲座、竞赛、社团和文娱活动。">
  <title>校园活动站｜发现校园精彩</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: "Microsoft YaHei", Arial, sans-serif;
      color: #243047;
      background-color: #f5f7fb;
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* 网站顶部 */
    header {
      min-height: 76px;
      padding: 0 9%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #ffffff;
      border-bottom: 1px solid #edf0f5;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #243b70;
      font-size: 20px;
      font-weight: 700;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      background-color: #4263eb;
      border-radius: 10px;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 36px;
    }

    nav a {
      color: #69758b;
      font-size: 15px;
      transition: color 0.2s;
    }

    nav a:hover,
    nav a.active {
      color: #4263eb;
    }

    /* 页面介绍区域 */
    .hero {
      min-height: 340px;
      margin: 36px 9% 60px;
      padding: 55px 65px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
      color: #ffffff;
      background: linear-gradient(120deg, #304fbd, #5479ed);
      border-radius: 20px;
    }

    .hero-content {
      max-width: 620px;
    }

    .hero-label,
    .section-label {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 3px;
    }

    .hero-label {
      color: #d4ddff;
    }

    .hero h1 {
      margin: 16px 0;
      font-size: 36px;
      line-height: 1.4;
    }

    .hero p {
      max-width: 560px;
      margin-bottom: 28px;
      color: #e1e8ff;
      font-size: 15px;
    }

    .primary-button {
      display: inline-block;
      padding: 11px 25px;
      color: #3657c9;
      background-color: #ffffff;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      transition: transform 0.2s;
    }

    .primary-button:hover {
      transform: translateY(-3px);
    }

    .hero-decoration {
      display: flex;
      flex-direction: column;
      gap: 8px;
      color: rgba(255, 255, 255, 0.16);
      font-size: 42px;
      font-weight: 800;
      line-height: 1.1;
    }

    /* 活动列表区域 */
    .events-section {
      margin: 0 9% 70px;
    }

    .section-heading {
      margin-bottom: 28px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
    }

    .section-label {
      color: #4263eb;
    }

    .section-heading h2 {
      margin: 8px 0;
      font-size: 28px;
      color: #243047;
    }

    .section-heading p {
      margin: 0;
      color: #8993a6;
      font-size: 14px;
    }

    .event-count {
      padding: 7px 14px;
      color: #4263eb;
      background-color: #e9eeff;
      border-radius: 20px;
      font-size: 13px;
    }

    .event-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 22px;
    }

    .event-card {
      padding: 26px;
      background-color: #ffffff;
      border: 1px solid #edf0f5;
      border-radius: 14px;
      box-shadow: 0 5px 20px rgba(30, 50, 90, 0.04);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .event-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 28px rgba(30, 50, 90, 0.1);
    }

    .event-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .event-category {
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
    }

    .category-lecture {
      color: #4263eb;
      background-color: #e9eeff;
    }

    .category-contest {
      color: #d97706;
      background-color: #fff3df;
    }

    .category-club {
      color: #0d9488;
      background-color: #dcf8f2;
    }

    .category-entertainment {
      color: #a855f7;
      background-color: #f4e8ff;
    }

    .event-number {
      color: #d9dfeb;
      font-size: 24px;
      font-weight: 700;
    }

    .event-card h3 {
      margin: 18px 0 10px;
      color: #263653;
      font-size: 20px;
    }

    .event-description {
      min-height: 48px;
      color: #7d879a;
      font-size: 14px;
    }

    .event-meta {
      margin: 20px 0;
      padding-top: 14px;
      border-top: 1px solid #f0f2f6;
    }

    .event-meta p {
      margin: 6px 0;
      color: #69758b;
      font-size: 13px;
    }

    .text-link {
      color: #4263eb;
      font-size: 14px;
      font-weight: 700;
    }

    .text-link:hover {
      color: #243b9e;
    }

    /* 关于我们 */
    .about-section {
      margin: 0 9% 70px;
      padding: 45px 50px;
      text-align: center;
      background-color: #eaf0ff;
      border-radius: 16px;
    }

    .about-section h2 {
      max-width: 650px;
      margin: 14px auto;
      color: #283f7e;
      font-size: 25px;
    }

    .about-section p {
      color: #7482a5;
      font-size: 14px;
    }

    /* 网站底部 */
    footer {
      padding: 28px 9%;
      text-align: center;
      color: #aab3c3;
      background-color: #202d49;
      font-size: 13px;
    }

    footer p {
      margin: 5px 0;
    }
  </style>
</head>

<body>
  <!-- 网站顶部 -->
  <header>
    <a class="logo" href="#" aria-label="校园活动站首页">
      <span class="logo-icon">C</span>
      <span>校园活动站</span>
    </a>

    <nav aria-label="主导航">
      <a class="active" href="#home">首页</a>
      <a href="#events">活动列表</a>
      <a href="#about">关于我们</a>
    </nav>
  </header>

  <main id="home">

    <!-- 网站介绍 -->
    <section class="hero">
      <div class="hero-content">
        <span class="hero-label">CAMPUS EVENTS</span>

        <h1>发现身边值得参加的校园活动</h1>

        <p>
          从学术讲座到社团活动，从创新竞赛到校园演出，
          在这里找到你感兴趣的下一站。
        </p>

        <a class="primary-button" href="#events">
          看看近期活动
        </a>
      </div>

      <div class="hero-decoration">
        <span>校园</span>
        <span>生活</span>
        <span>精彩</span>
      </div>
    </section>

    <!-- 活动列表 -->
    <section class="events-section" id="events">
      <div class="section-heading">
        <div>
          <span class="section-label">WHAT'S ON</span>
          <h2>近期活动</h2>
          <p>挑选一场感兴趣的活动，开启新的校园体验。</p>
        </div>

        <span class="event-count" id="eventCount">0 场精彩活动</span>
      </div>

      <!-- 活动卡片由 JavaScript 自动生成 -->
      <div class="event-list" id="eventList">
      </div>
    </section>

    <!-- 关于我们 -->
    <section class="about-section" id="about">
      <span class="section-label">ABOUT US</span>

      <h2>让每一次校园活动，都成为值得记住的经历。</h2>

      <p>
        校园活动站汇集校园近期活动信息，
        帮助同学们发现兴趣、参与校园生活。
      </p>
    </section>

  </main>

  <!-- 网站底部 -->
  <footer>
    <p>校园活动站 · 发现校园精彩</p>
    <p>活动信息仅用于课程项目演示。</p>
  </footer>

  <script>
    // 1. 使用数组保存校园活动数据
    const events = [
      {
        title: "人工智能与未来生活",
        category: "学术讲座",
        categoryClass: "category-lecture",
        description: "了解人工智能的发展趋势，以及它将如何影响我们的学习与生活。",
        time: "2026年11月12日 14:00",
        location: "图书馆报告厅"
      },
      {
        title: "校园创意编程挑战赛",
        category: "创新竞赛",
        categoryClass: "category-contest",
        description: "和队友一起动手，把一个有趣的想法变成可以运行的小作品。",
        time: "2026年11月16日 09:00",
        location: "信息楼 301 室"
      },
      {
        title: "摄影社秋日外拍",
        category: "社团活动",
        categoryClass: "category-club",
        description: "带上相机或手机，和摄影社成员一起记录校园里的秋日风景。",
        time: "2026年11月18日 16:00",
        location: "校园东门集合"
      },
      {
        title: "校园草坪音乐会",
        category: "校园文娱",
        categoryClass: "category-entertainment",
        description: "在轻松的夜晚听听音乐，认识新朋友，感受校园的活力。",
        time: "2026年11月21日 19:00",
        location: "中心草坪"
      }
    ];

    // 2. 找到页面中放置活动卡片的位置
    const eventList = document.querySelector("#eventList");
    const eventCount = document.querySelector("#eventCount");

    // 3. 根据活动数据生成 HTML
    function renderEvents() {
      let html = "";

      events.forEach((event, index) => {
        html += `
          <article class="event-card">
            <div class="event-card-top">
              <span class="event-category ${event.categoryClass}">
                ${event.category}
              </span>
              <span class="event-number">
                ${String(index + 1).padStart(2, "0")}
              </span>
            </div>

            <h3>${event.title}</h3>

            <p class="event-description">
              ${event.description}
            </p>

            <div class="event-meta">
              <p>📅 ${event.time}</p>
              <p>📍 ${event.location}</p>
            </div>

            <a class="text-link" href="#about">了解详情 →</a>
          </article>
        `;
      });

      // 4. 将生成的 HTML 放入页面
      eventList.innerHTML = html;

      // 5. 更新活动数量
      eventCount.textContent = `${events.length} 场精彩活动`;
    }

    // 页面加载后生成活动列表
    renderEvents();
  </script>
</body>
</html>
